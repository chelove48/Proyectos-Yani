<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perdon Yani ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
font-family:'Segoe UI',sans-serif;
}

/* Sobre */

.envelope{
position:relative;
width:320px;
height:220px;
cursor:pointer;
}

.base{
position:absolute;
width:100%;
height:100%;
background:#ff6b81;
border-radius:0 0 10px 10px;
}

.flap{
position:absolute;
width:0;
height:0;
border-left:160px solid transparent;
border-right:160px solid transparent;
border-top:120px solid #ff4757;
transform-origin:top;
transition:1s;
z-index:3;
}

.letter{
position:absolute;
width:90%;
height:180px;
background:white;
left:5%;
top:20px;
border-radius:10px;
padding:20px;
text-align:center;
transform:translateY(80px);
transition:1s;
z-index:1;
overflow:auto;
}

.letter h1{
color:#ff4757;
margin-bottom:10px;
}

.open .flap{
transform:rotateX(180deg);
}

.open .letter{
transform:translateY(-120px);
}

/* Corazones */

.heart{
position:absolute;
color:red;
animation:float 5s linear infinite;
font-size:20px;
}

@keyframes float{
from{
transform:translateY(100vh);
opacity:1;
}
to{
transform:translateY(-100px);
opacity:0;
}
}

/* Mensaje */

.message{
line-height:1.6;
color:#444;
}
</style>
</head>

<body>

<div class="envelope" id="envelope">
    
    <div class="flap"></div>

    <div class="base"></div>
    
    <div class="letter">
        <h1>💌 Perdón</h1>
        
        <div class="message">
            Perdoname mucho yani achicharre tu corazoncito y no era mi intencion
            ¿me perdonas?
            <br><br>
            pd. "Si sali tome, cometi un error"
            <br>
            - Emilio Atun
        </div>
    </div>
</div>

<!-- Música -->
<audio id="music" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
const envelope = document.getElementById("envelope");
const music = document.getElementById("music");

envelope.addEventListener("click", () => {
    envelope.classList.toggle("open");

    // Reproduce la música al hacer clic
    if (music.paused) {
        music.play().catch(e => console.log("Error al reproducir audio:", e));
    }
});

/* Corazones flotando */
setInterval(() => {
    let heart = document.createElement("div");
    
    heart.className = "heart";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 25 + 15) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);

}, 300);
</script>

</body>
</html>
